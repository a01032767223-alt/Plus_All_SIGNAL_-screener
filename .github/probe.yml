name: 데이터소스 진단

# 국내주식·미국주식·코인 데이터를 어디서 받을 수 있는지 GitHub 서버에서 직접 확인합니다.
# Actions 탭 → "데이터소스 진단" → Run workflow → 끝나면 로그를 복사해서 보내주세요.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: |
          pip install --quiet "pandas>=2.2,<3.0" requests lxml \
                              yfinance finance-datareader pykrx || true

      - name: 소스별 접속 테스트
        run: |
          python - <<'PYCODE'
          import json, sys, time, traceback
          import requests

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36",
                "Referer": "https://finance.naver.com/"}
          results = []

          def probe(name, fn):
              t0 = time.time()
              try:
                  detail = fn()
                  ok = True
              except Exception as e:
                  detail = f"{type(e).__name__}: {str(e)[:160]}"
                  ok = False
              results.append((name, ok, round(time.time() - t0, 1), detail))
              print(("  [OK]   " if ok else "  [FAIL] ") + name + " :: " + str(detail), flush=True)

          print("\n===== 1. 실행 서버 위치 =====", flush=True)
          try:
              ip = requests.get("https://ipinfo.io/json", timeout=10).json()
              print(f"  IP {ip.get('ip')} / {ip.get('country')} / {ip.get('org')}", flush=True)
          except Exception as e:
              print("  IP 조회 실패:", e, flush=True)

          print("\n===== 2. 국내주식 소스 =====", flush=True)

          def naver_list():
              r = requests.get("https://finance.naver.com/sise/sise_market_sum.naver",
                               params={"sosok": 0, "page": 1}, headers=UA, timeout=15)
              n = r.text.count("/item/main.naver?code=")
              if r.status_code != 200 or n == 0:
                  raise RuntimeError(f"HTTP {r.status_code}, 종목링크 {n}개, 본문 {len(r.text)}바이트")
              return f"HTTP 200, 종목 링크 {n}개 파싱됨"
          probe("네이버 시가총액 목록", naver_list)

          def naver_ohlcv():
              r = requests.get("https://api.finance.naver.com/siseJson.naver",
                               params={"symbol": "005930", "requestType": 1,
                                       "startTime": "20260601", "endTime": "20260814",
                                       "timeframe": "day"}, headers=UA, timeout=15)
              body = r.text.strip()
              if r.status_code != 200 or not body.startswith("["):
                  raise RuntimeError(f"HTTP {r.status_code} / 앞부분: {body[:120]!r}")
              return f"HTTP 200, 약 {body.count('[') - 1}행, 응답 {len(body)}바이트"
          probe("네이버 일봉 API (siseJson)", naver_ohlcv)

          def yahoo_raw():
              r = requests.get("https://query1.finance.yahoo.com/v8/finance/chart/005930.KS",
                               params={"range": "3mo", "interval": "1d"},
                               headers={"User-Agent": UA["User-Agent"]}, timeout=15)
              j = r.json()
              res = j["chart"]["result"][0]
              n = len(res["timestamp"])
              last = res["indicators"]["quote"][0]["close"][-1]
              return f"삼성전자 {n}봉, 최근 종가 {last}"
          probe("야후 차트 API (직접 호출)", yahoo_raw)

          def yahoo_batch():
              import yfinance as yf
              df = yf.download(["005930.KS", "000660.KS", "035720.KS", "247540.KQ"],
                               period="6mo", interval="1d", group_by="ticker",
                               auto_adjust=False, progress=False, threads=True)
              if df.empty:
                  raise RuntimeError("빈 결과")
              cols = {c[0] for c in df.columns}
              return f"{len(df)}일 × {len(cols)}종목 ({sorted(cols)})"
          probe("yfinance 일괄 다운로드 (4종목)", yahoo_batch)

          def fdr_listing():
              import FinanceDataReader as fdr
              df = fdr.StockListing("KOSPI")
              return f"{len(df)}종목, 컬럼 {list(df.columns)[:6]}"
          probe("FinanceDataReader 종목목록", fdr_listing)

          def fdr_ohlcv():
              import FinanceDataReader as fdr
              df = fdr.DataReader("005930", "2026-06-01")
              return f"{len(df)}행, 최근 종가 {df['Close'].iloc[-1]}"
          probe("FinanceDataReader 일봉", fdr_ohlcv)

          def krx_direct():
              r = requests.post("https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd",
                                data={"bld": "dbms/MDC/STAT/standard/MDCSTAT01501",
                                      "mktId": "ALL", "trdDd": "20260813"},
                                headers={**UA, "Referer": "http://data.krx.co.kr/"}, timeout=15)
              j = r.json()
              k = next(iter(j))
              return f"HTTP 200, 키 {list(j)[:3]}, 행수 {len(j[k]) if isinstance(j[k], list) else '?'}"
          probe("KRX 직접 호출 (로그인 없이)", krx_direct)

          def pykrx_call():
              from pykrx import stock
              df = stock.get_market_ohlcv_by_ticker("20260813", market="ALL")
              return f"{len(df)}종목"
          probe("pykrx (로그인 없이)", pykrx_call)

          print("\n===== 3. 미국주식 소스 =====", flush=True)

          def us_sp500_fdr():
              import FinanceDataReader as fdr
              df = fdr.StockListing("S&P500")
              return f"{len(df)}종목, 컬럼 {list(df.columns)[:6]}"
          probe("FinanceDataReader S&P500 목록", us_sp500_fdr)

          def us_sp500_csv():
              url = ("https://raw.githubusercontent.com/datasets/s-and-p-500-companies"
                     "/main/data/constituents.csv")
              r = requests.get(url, headers=UA, timeout=20)
              if r.status_code != 200:
                  raise RuntimeError(f"HTTP {r.status_code}")
              return f"HTTP 200, {r.text.count(chr(10)) - 1}행 (대체 경로)"
          probe("S&P500 목록 대체(GitHub CSV)", us_sp500_csv)

          def us_ndx_wiki():
              r = requests.get("https://en.wikipedia.org/wiki/Nasdaq-100", headers=UA, timeout=20)
              if r.status_code != 200:
                  raise RuntimeError(f"HTTP {r.status_code}")
              return f"HTTP 200, {len(r.text):,}바이트"
          probe("나스닥100 목록(위키백과)", us_ndx_wiki)

          def us_exchange_dir():
              r = requests.get("https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
                               headers=UA, timeout=20)
              if r.status_code != 200:
                  raise RuntimeError(f"HTTP {r.status_code}")
              return f"HTTP 200, {len(r.text.splitlines())}행 (거래소 매핑용)"
          probe("나스닥 심볼 디렉터리", us_exchange_dir)

          def us_yahoo_batch():
              import yfinance as yf
              df = yf.download(["AAPL", "MSFT", "NVDA", "BRK-B"], period="6mo", interval="1d",
                               group_by="ticker", auto_adjust=False, progress=False, threads=True)
              if df.empty:
                  raise RuntimeError("빈 결과")
              cols = {c[0] for c in df.columns}
              return f"{len(df)}일 × {len(cols)}종목 ({sorted(cols)})"
          probe("yfinance 미국주식 일괄 (4종목)", us_yahoo_batch)

          print("\n===== 4. 코인 소스 =====", flush=True)

          def upbit_markets():
              r = requests.get("https://api.upbit.com/v1/market/all",
                               params={"isDetails": "true"}, timeout=15)
              if r.status_code != 200:
                  raise RuntimeError(f"HTTP {r.status_code} :: {r.text[:120]}")
              krw = [m for m in r.json() if m["market"].startswith("KRW-")]
              return f"KRW 마켓 {len(krw)}종목"
          probe("업비트 마켓 목록", upbit_markets)

          def upbit_candles():
              r = requests.get("https://api.upbit.com/v1/candles/days",
                               params={"market": "KRW-BTC", "count": 30}, timeout=15)
              if r.status_code != 200:
                  raise RuntimeError(f"HTTP {r.status_code} :: {r.text[:120]}")
              d = r.json()
              return f"BTC {len(d)}봉, 최근 종가 {d[0]['trade_price']:,}"
          probe("업비트 일봉", upbit_candles)

          def bithumb():
              r = requests.get("https://api.bithumb.com/public/ticker/ALL_KRW", timeout=15)
              j = r.json()
              return f"status {j.get('status')}, {len(j.get('data', {}))}종목"
          probe("빗썸 (업비트 대체용)", bithumb)

          print("\n\n===== 요약 =====", flush=True)
          w = max(len(n) for n, *_ in results)
          for name, ok, sec, detail in results:
              print(f"{'✅' if ok else '❌'} {name.ljust(w)}  {sec:>5.1f}s  {detail}", flush=True)

          usable = [n for n, ok, *_ in results if ok]
          print(f"\n사용 가능한 소스 {len(usable)}개: {usable}", flush=True)
          PYCODE
