name: 지표 로직 테스트

on:
  push:
    paths:
      - "screener/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# 이 워크플로는 아무것도 커밋하지 않습니다. 기본 권한(리포에 따라 쓰기)을 그대로
# 물려받지 않도록 읽기로 좁힙니다 — 서드파티 패키지가 토큰에 닿지 못하게.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 예전에는 테스트 파일을 하나씩 나열해 돌렸는데, pytest 형식으로 쓴 파일
      # (test_reversal.py · test_custom.py)은 `python 파일.py`로 실행하면 아무것도
      # 돌지 않아 초록불인 채로 조용히 빠져 있었습니다. 디렉터리 단위로 바꿔
      # 새 테스트 파일이 자동으로 포함되게 합니다.
      - run: python -m pytest tests -q
      - name: 합성 데이터 파이프라인 점검
        run: python -m screener.run --market demo
