name: 코인 스크리닝

on:
  schedule:
    # 4시간마다 (UTC 00/04/08/12/16/20시 20분 = KST 09/13/17/21/01/05시)
    # 국내주식(07:10 UTC)·미국주식(21:30 UTC) 실행 창을 피해서 20분으로 잡았습니다.
    # 05분이던 시절엔 국내주식이 늦게 끝나면 08:05 코인 실행과 겹쳤습니다.
    - cron: "20 0,4,8,12,16,20 * * *"
  workflow_dispatch:

concurrency:
  group: screen-coin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리닝 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          # KST 09시 실행분만 전체 요약 발송, 나머지는 신규 진입만 알림
          # 스케줄 지연으로 00시를 넘겨 시작해도 일일 요약이 빠지지 않게 01시까지 허용
          if [ "$(date -u +%H)" -lt 2 ]; then
            python -m screener.run --market coin --notify --daily-summary
          else
            python -m screener.run --market coin --notify
          fi

      - name: 결과 커밋
        env:
          # ${{ }}를 run 블록 안에서 직접 펼치면 브랜치 이름이 셸 명령으로
          # 해석될 수 있어(스크립트 인젝션) 환경변수로 받아서 인용해 씁니다.
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "코인 스크리닝 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 다른 시장 워크플로가 동시에 push했을 수 있어 rebase 후 재시도합니다.
          # rebase가 충돌로 멈추면 반드시 abort해야 다음 시도가 가능합니다.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$REF" && git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            # abort하면 방금 만든 커밋은 그대로 남는다. reset --hard를 걸면
            # 커밋까지 날아가 재시도할 게 없어지므로 abort까지만 한다.
            git rebase --abort 2>/dev/null || true
            echo "push 실패 — 재시도합니다 (시도 $i)"
            sleep $((i * 10))
          done
          echo "::error::3회 시도했지만 결과를 push하지 못했습니다. 다른 워크플로와 충돌했을 수 있습니다."
          exit 1
